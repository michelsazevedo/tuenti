services:
  test: &base
    build:
      context: ./
      target: dev
    image: tuenti-test
    command: go test -v ./...
    volumes:
      - .:/go/src/github.com/michelsazevedo/tuenti/
      - go_build_cache:/root/.cache/go-build
    depends_on:
      - db
      - jaeger
    stdin_open: true
    tty: true
    environment:
      - POSTGRES_USER=tuenti
      - POSTGRES_PASSWORD=tuentipwd
      - POSTGRES_DB=tuenti
      - POSTGRES_HOST=db:5432
      - ENV_APP=development
      - OTLP_ENDPOINT=jaeger:4318

  web:
    <<: *base
    image: tuenti_web
    command: go run cmd/main.go
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=tuenti
      - POSTGRES_PASSWORD=tuentipwd
      - POSTGRES_DB=tuenti

  jaeger:
    image: jaegertracing/all-in-one
    restart: unless-stopped
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  db_data:
  go_build_cache:
